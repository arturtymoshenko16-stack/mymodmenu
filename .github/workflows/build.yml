name: Mobile APK and SO Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unpack and Move Files
      run: |
        unzip -o MOD_MENU_final_v18.zip
        rm MOD_MENU_final_v18.zip
        # Якщо файли розпакувалися в підпапку, дістаємо їх звідти
        if [ -d "MOD_MENU_HACK_3.0_BUILD_SOURCE" ]; then
          mv MOD_MENU_HACK_3.0_BUILD_SOURCE/* . 2>/dev/null || true
          mv MOD_MENU_HACK_3.0_BUILD_SOURCE/.* . 2>/dev/null || true
          rm -rf MOD_MENU_HACK_3.0_BUILD_SOURCE
        fi
        ls -la # Покаже структуру папок у логах для перевірки

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Make Gradle Executable
      run: |
        # Шукаємо gradlew, де б він не знаходився, і робимо його виконуваним
        find . -name "gradlew" -exec chmod +x {} \;

    - name: Build Arm32 and Arm64 Projects
      run: |
        # Знаходимо потрібну папку з gradlew і запускаємо збірку з неї
        GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \;)
        cd $GRADLE_DIR
        ./gradlew assembleRelease

    - name: Pack and Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: Finished-APKs
        path: "**/build/outputs/apk/release/*.apk"

    - name: Pack and Upload SO Libraries
      uses: actions/upload-artifact@v4
      with:
        name: Native-SO-Libraries
        path: "**/build/intermediates/cmake/release/obj/"
        
