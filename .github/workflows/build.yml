name: Mobile APK and SO Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unpack and Restore Original Project
      run: |
        # Розпаковуємо архів
        unzip -o MOD_MENU_final_v18.zip
        rm MOD_MENU_final_v18.zip
        
        # Переміщуємо оригінальні файли розробника в корінь проекту
        if [ -d "MOD_MENU_HACK_3.0_BUILD_SOURCE" ]; then
          mv MOD_MENU_HACK_3.0_BUILD_SOURCE/* . 2>/dev/null || true
          mv MOD_MENU_HACK_3.0_BUILD_SOURCE/.* . 2>/dev/null || true
          rm -rf MOD_MENU_HACK_3.0_BUILD_SOURCE
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Update Gradle Wrapper and Injection Config
      run: |
        # Створюємо чистий запуск Gradle версії 8.2 (виправляє сумісність із Java 17)
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

        # Модифікуємо оригінальний app/build.gradle, додаючи розділення на 32-біт та 64-біт APK
        if [ -f "app/build.gradle" ]; then
          sed -i '/android {/a \    splits { abi { enable true; reset(); include "armeabi-v7a", "arm64-v8a"; universalApk false } }' app/build.gradle
          sed -i '/defaultConfig {/a \        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }' app/build.gradle
        fi

    - name: Build 32-bit and 64-bit APK and SO
      run: |
        # Запуск оригінальної збірки додатка
        ./gradlew assembleRelease --no-daemon

    - name: Pack and Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: Finished-APKs
        path: "**/build/outputs/apk/release/*.apk"

    - name: Pack and Upload SO Libraries
      uses: actions/upload-artifact@v4
      with:
        name: Native-SO-Libraries
        path: "**/build/intermediates/cmake/release/obj/"
        
