name: Mobile APK and SO Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unpack and Restore Original Project
      run: |
        unzip -o MOD_MENU_final_v18.zip
        rm MOD_MENU_final_v18.zip
        if [ -d "MOD_MENU_HACK_3.0_BUILD_SOURCE" ]; then
          mv MOD_MENU_HACK_3.0_BUILD_SOURCE/* . 2>/dev/null || true
          mv MOD_MENU_HACK_3.0_BUILD_SOURCE/.* . 2>/dev/null || true
          rm -rf MOD_MENU_HACK_3.0_BUILD_SOURCE
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Clean App Configuration
      run: |
        # Оновлюємо версію Gradle для сумісності з сервером
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

        # Перезаписуємо app/build.gradle чистою конфігурацією без конфліктів
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            compileSdk 34
            namespace "com.android.support"
            defaultConfig {
                applicationId "com.android.support"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "3.0"
            }
            splits {
                abi {
                    enable true
                    reset()
                    include "armeabi-v7a", "arm64-v8a"
                    universalApk false
                }
            }
            externalNativeBuild {
                cmake {
                    path "src/main/cpp/CMakeLists.txt"
                    version "3.22.1"
                }
            }
        }
        EOF

    - name: Build 32-bit and 64-bit APK and SO
      run: |
        ./gradlew assembleRelease --no-daemon

    - name: Pack and Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: Finished-APKs
        path: "**/build/outputs/apk/release/*.apk"

    - name: Pack and Upload SO Libraries
      uses: actions/upload-artifact@v4
      with:
        name: Native-SO-Libraries
        path: "**/build/intermediates/cmake/release/obj/"
        
