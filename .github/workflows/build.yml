name: Mobile APK and SO Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unpack and Setup Project
      run: |
        # 1. Розпаковуємо ваш архів
        unzip -o MOD_MENU_final_v18.zip
        rm MOD_MENU_final_v18.zip
        
        # 2. Переміщуємо файли з папки MOD_MENU_HACK_3.0_BUILD_SOURCE у корінь
        mv MOD_MENU_HACK_3.0_BUILD_SOURCE/* . 2>/dev/null || true
        mv MOD_MENU_HACK_3.0_BUILD_SOURCE/.* . 2>/dev/null || true
        rm -rf MOD_MENU_HACK_3.0_BUILD_SOURCE

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      run: |
        # Гарантовано робимо оригінальний градл виконуваним
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          # Якщо його не було, створюємо робочу обгортку
          gradle wrapper --gradle-version 8.1.1
          chmod +x gradlew
        fi

    - name: Build 32-bit and 64-bit APK and SO
      run: |
        ./gradlew assembleRelease --no-daemon

    - name: Pack and Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: Finished-APKs
        path: "**/build/outputs/apk/release/*.apk"

    - name: Pack and Upload SO Libraries
      uses: actions/upload-artifact@v4
      with:
        name: Native-SO-Libraries
        path: "**/build/intermediates/cmake/release/obj/"
        
