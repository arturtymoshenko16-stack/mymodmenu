name: Mobile APK and SO Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unpack and Setup Project
      run: |
        unzip -o MOD_MENU_final_v18.zip
        rm MOD_MENU_final_v18.zip
        if [ -d "MOD_MENU_HACK_3.0_BUILD_SOURCE" ]; then
          mv MOD_MENU_HACK_3.0_BUILD_SOURCE/* . 2>/dev/null || true
          mv MOD_MENU_HACK_3.0_BUILD_SOURCE/.* . 2>/dev/null || true
          rm -rf MOD_MENU_HACK_3.0_BUILD_SOURCE
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Upgrade Gradle Version
      run: |
        # Примусово оновлюємо Gradle до версії 8.2, яку просить сервер
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build 32-bit and 64-bit APK and SO
      run: |
        ./gradlew assembleRelease --no-daemon

    - name: Pack and Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: Finished-APKs
        path: "**/build/outputs/apk/release/*.apk"

    - name: Pack and Upload SO Libraries
      uses: actions/upload-artifact@v4
      with:
        name: Native-SO-Libraries
        path: "**/build/intermediates/cmake/release/obj/"
        
